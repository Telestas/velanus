name: Deploy to GitHub Pages

# Se despliega al etiquetar una versión, no al empujar a main: así main puede
# recibir trabajo sin que cada commit salga a producción, y cada despliegue
# queda asociado a una versión concreta.
#
#   git tag v0.0.2 && git push origin v0.0.2
#
# `workflow_dispatch` queda como escape para redesplegar a mano.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Permisos que necesita actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancela el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: la comprobación de abajo necesita comparar la
          # etiqueta con main, y un clon superficial no lo permite.
          fetch-depth: 0

      # La etiqueta tiene que estar en main: evita publicar desde una rama
      # suelta por descuido.
      - name: Comprobar que la etiqueta está en main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no apunta a un commit de main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
