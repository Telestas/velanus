<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Metadatos de la home. Al navegar, src/seo.ts los reescribe para cada
      pantalla; los rastreadores de redes sociales no ejecutan JavaScript, así
      que lo que compartan siempre mostrará esta tarjeta hasta que el sitio
      sirva HTML por ruta.
    -->
    <title>Vela Nus · Consultores &amp; Asociados — Consultoría corporativa en Cuba</title>
    <meta
      name="description"
      content="Constitución de empresas, contabilidad y trámites en Cuba para empresas e inversores extranjeros. Alcance, plazos y honorarios por escrito. Atención en español e inglés."
    />
    <link rel="canonical" href="https://velanus.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vela Nus Consultores &amp; Asociados" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://velanus.com/" />
    <meta
      property="og:title"
      content="Vela Nus · Consultores &amp; Asociados — Consultoría corporativa en Cuba"
    />
    <meta
      property="og:description"
      content="Constitución de empresas, contabilidad y trámites en Cuba para empresas e inversores extranjeros. Alcance, plazos y honorarios por escrito."
    />
    <meta property="og:image" content="https://velanus.com/og-velanus.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vela Nus Consultores &amp; Asociados" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vela Nus · Consultores &amp; Asociados — Consultoría corporativa en Cuba"
    />
    <meta
      name="twitter:description"
      content="Constitución de empresas, contabilidad y trámites en Cuba para empresas e inversores extranjeros."
    />
    <meta name="twitter:image" content="https://velanus.com/og-velanus.jpg" />

    <link rel="icon" type="image/png" href="/logo-vn-ambar-simbolo.png" />
    <link rel="apple-touch-icon" href="/logo-vn-ambar-simbolo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!--
      Datos estructurados. Solo se declara lo que se puede sostener: nombre,
      contacto, dirección, idiomas y las líneas de servicio. Sin valoraciones ni
      cifras inventadas, que además Google penaliza si no son verificables.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LegalService",
        "name": "Vela Nus Consultores & Asociados",
        "url": "https://velanus.com/",
        "image": "https://velanus.com/og-velanus.jpg",
        "logo": "https://velanus.com/logo-vn-ambar-simbolo.png",
        "description": "Consultoría corporativa en Cuba: constitución de empresas, contabilidad, asesoría legal, trámites y visas para clientes nacionales e internacionales.",
        "email": "contacto@velanus.cu",
        "telephone": "+53 5 385 4623",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Infanta entre Peñalver y Sitios, Centro Habana",
          "addressLocality": "La Habana",
          "addressCountry": "CU"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Cuba"
        },
        "availableLanguage": ["es", "en"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Servicios",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Contabilidad y teneduría de libros",
                "url": "https://velanus.com/servicios/contabilidad"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Asesoría legal corporativa",
                "url": "https://velanus.com/servicios/legal"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Trámites, documentos y visas",
                "url": "https://velanus.com/servicios/tramites-y-visas"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Eventos y capacitación",
                "url": "https://velanus.com/servicios/eventos"
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-[#000000] antialiased selection:bg-[#F9A600] selection:text-[#000000]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
